[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtpy-task-runner"
version = "0.1.0"
description = "Process-pool task executor with Qt signals, status widget, pause/cancel"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
requires-python = ">=3.8"
authors = [{ name = "bodencrouch" }]
dependencies = [
    "qtpy",
]

[project.urls]
Homepage = "https://github.com/bodencrouch/qtpy-task-runner"
Repository = "https://github.com/bodencrouch/qtpy-task-runner"

[tool.setuptools.packages.find]
where = ["src"]
